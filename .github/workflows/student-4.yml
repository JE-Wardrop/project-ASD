# Student 4 - Minh Sang Dang - User Management
name: student-4

on:
  push:
    paths:
      - "student-4/**"
      - "docker-compose.yml"
      - ".github/workflows/student-4.yml"
  pull_request:
    paths:
      - "student-4/**"
  workflow_dispatch:

jobs:
  # 1. Unit and integration tests
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-4/backend/requirements.txt
          pip install -r student-4/database/requirements.txt
          pip install pytest
      - name: Run pytest
        # run: pytest student-5/tests -v

  # 2. Build the three containers and check they answer /health
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose
        run: docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

      - name: Build student-4 services
        run: docker compose build student5-db student5-backend student5-frontend

      - name: Start student-4 services
        run: docker compose up -d student5-db student5-backend student5-frontend

      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=10
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                     --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS  $url -> $code"
                return 0
              fi
              echo "wait  $i/$attempts  $url (got: ${code:-none})"
              sleep 3
            done

            echo "FAIL  $url after $attempts attempts"
            return 1
          }

          check_url "http://localhost:8104/"
          check_url "http://localhost:8204/health"
          check_url "http://localhost:8304/health"

      - name: Stop services
        if: always()
        run: docker compose down -v

  # 3. Evidence for the technical report
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: [build-and-smoke]

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI evidence
        run: |
          mkdir -p reports

          cat > reports/report.json << EOF
          {
            "workflow": "student-4",
            "student": "student-4",
            "feature": "User Management",
            "owner": "Minh Sang Dang",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > reports/report.md << EOF
          - Workflow: student-4 
          - Run ID: ${{ github.run_id }} 
          - Commit: ${{ github.sha }} 
          - Branch: ${{ github.ref_name }} 
          - Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
      - name: Generate run-view.md
        run: |
          cat > reports/run-view.md << EOF
          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: student-4-ci-report
          path: reports
