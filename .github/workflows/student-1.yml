# Student 1 - Juno Wardrop - Card Management
# Builds and validates ONLY student-1 microservices.

name: student-1-ci

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "student-1/**"
      - "shared/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "shared/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-1/backend/requirements.txt
          pip install -r student-1/database/requirements.txt
          pip install pytest

      - name: Syntax check
        run: python -m compileall -q student-1

      - name: Run pytest
        run: pytest student-1/tests -v

#build-and-smoke for student-1
  smoke-check:
    name: smoke test
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build student-1 services
        run: docker compose build --no-cache student-1-db student-1-backend student-1-frontend

      - name: Start student-1 services
        run: docker compose up -d student-1-db student-1-backend student-1-frontend

      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=10
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                     --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS  $url -> $code"
                return 0
              fi
              echo "wait  $i/$attempts  $url (got: ${code:-none})"
              sleep 3
            done

            echo "FAIL  $url after $attempts attempts"
            return 1
          }

          check_url "http://localhost:8101/"
          check_url "http://localhost:8201/"
          check_url "http://localhost:8301/"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs student-1-db student-1-backend student-1-frontend

      - name: Stop services
        if: always()
        run: docker compose down -v

#evidence-pack for student-1
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI evidence
        run: |
          mkdir -p reports

          cat > reports/report.json << EOF
          {
            "workflow": "student-1",
            "student": "student-1",
            "feature": "Card Management",
            "owner": "Juno Wardrop",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > reports/report.md << EOF
          # Student 1 CI Report - Card Management

          | Field | Value |
          |---|---|
          | Workflow | student-1 |
          | Run ID | ${{ github.run_id }} |
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Generated | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Stages

          1. Tests - pytest over student-1/tests
          2. Build and smoke test - three containers built, /health verified
          3. Evidence pack - this report

          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: student-1-ci-report
          path: reports