# # Student 1 - Juno Wardrop - Card Management
# # Builds and validates ONLY student-1 microservices.
name: student-1-ci

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "student-1/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"

jobs:

  build-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

      - name: Build services
        run: docker-compose build
    
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
  
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage pre-commit --files $(git diff-tree --no-commit-id --name-only -r ${{ github.sha }}) student-1-ruff-scan student-1-detect-secrets-scan student-1-pip-audit-scan


  post_commit_tests:
    runs-on: ubuntu-latest
    needs: [build-images]
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]
    env:
      # Disabled MCP
      MCP_ENABLED: "false"

      # Disables RAG 
      RAG_ENABLED: "false"

      # Disables multi-agent
      MULTI_AGENT_ENABLED: "false"
      
    steps:
      - uses: actions/checkout@v4


      # ---- New stuff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install pytest requests
    # ----------

      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)


      - name: Start services
        run: docker-compose up -d
        


    # ------ New stuff
      - name: Wait for services
        run: |
          for url in http://localhost:8101/ http://localhost:8201/ http://localhost:8301/; do
            for i in $(seq 1 15); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)
              [ "$code" = "200" ] && echo "READY $url" && break
              echo "Waiting for $url (attempt $i, got: ${code:-none})"
              sleep 2
            done
          done

      - name: Run post-commit tests
        shell: bash
        run: |
          mkdir -p student-1/tests/reports
          set +e
          python -m pytest student-1/tests/post_commit -v \
            --junitxml=student-1/tests/reports/post-commit-junit.xml \
            | tee student-1/tests/reports/post-commit-report.md
          status=${PIPESTATUS[0]}
          set -e
          printf '{"status": "%s", "timestamp": "%s"}\n' \
            "$([ "$status" -eq 0 ] && echo PASS || echo FAIL)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> student-1/tests/reports/test-audit.jsonl
          exit "$status"

      - name: Upload post-commit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-1-post-commit-reports
          path: student-1/tests/reports
    #---------

      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi
              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL $url after $attempts attempts"
            return 1
          }

          check_url "http://localhost:8101/"
          check_url "http://localhost:8201/"
          check_url "http://localhost:8301/"

      - name: Stop services
        if: always()
        run: docker-compose down -v

#evidence-pack for student-1
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI evidence
        run: |
          mkdir -p reports

          cat > reports/report.json << EOF
          {
            "workflow": "student-1",
            "student": "student-1",
            "feature": "Card Management",
            "owner": "Juno Wardrop",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > reports/report.md << EOF
          # Student 1 CI Report - Card Management

          | Field | Value |
          |---|---|
          | Workflow | student-1 |
          | Run ID | ${{ github.run_id }} |
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Generated | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Stages

          1. Build test
          2. Smoke Check
          3. Evidence Pack

          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: student-1-ci-report
          path: reports
