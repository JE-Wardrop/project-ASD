  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

      - name: Start services
        run: docker-compose up -d
        
      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi
              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL $url after $attempts attempts"
            return 1
          }

          check_url "http://localhost:8101/"
          check_url "http://localhost:8201/"
          check_url "http://localhost:8301/"

      - name: Stop services
        if: always()
        run: docker-compose down -v

#evidence-pack for student-1
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI evidence
        run: |
          mkdir -p reports

          cat > reports/report.json << EOF
          {
            "workflow": "student-1",
            "student": "student-1",
            "feature": "Card Management",
            "owner": "Juno Wardrop",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > reports/report.md << EOF
          # Student 1 CI Report - Card Management

          | Field | Value |
          |---|---|
          | Workflow | student-1 |
          | Run ID | ${{ github.run_id }} |
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Generated | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Stages

          1. Tests - pytest over student-1/tests
          2. Build and smoke test - three containers built, /health verified
          3. Evidence pack - this report

          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: student-1-ci-report
          path: reports