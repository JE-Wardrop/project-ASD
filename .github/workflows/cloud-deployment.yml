name: cloud-deployment

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  post_commit_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests "PyJWT>=2.11.0"

      - name: Start services
        working-directory: enrolment-app-open-ai
        run: docker compose up -d --build

    #   - name: Run post-commit tests
    #     working-directory: enrolment-app-open-ai
    #     run: |
    #       mkdir -p reports/lab11
    #       python -m pytest tests/lab11/post_commit/ -v > reports/lab11/test-results.md
    #       status=$?
    #       echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> reports/lab11/test-audit.jsonl

      - name: Stop services
        if: always()
        working-directory: enrolment-app-open-ai
        run: docker compose down -v

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab11-azure-test-evidence
          path: /docs/testing/

