name: cloud-deployment

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  post_commit_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests "PyJWT>=2.11.0"

      - name: Start services
        working-directory: .
        run: docker compose up -d --build

    # Add one for each student service once I can confirm this one works
      - name: Run student-1 post-commit tests
        working-directory: student-1
        run: |
          mkdir -p docs/post-commit
          python -m pytest student-1/tests/post_commit/ -v > docs/post-commit/test-results.md
          status=$?
          echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> docs/post-commit/test-audit-s1.jsonl

      - name: Run student-2 post-commit tests
        working-directory: student-2
        run: |
          mkdir -p docs/post-commit
          python -m pytest student-2/tests/post_commit/ -v > docs/post-commit/test-results.md
          status=$?
          echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> docs/post-commit/test-audit-s2.jsonl

      - name: Run student-4 post-commit tests
        working-directory: student-4
        run: |
          mkdir -p docs/post-commit
          python -m pytest student-4/tests/post_commit/ -v > docs/post-commit/test-results.md
          status=$?
          echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> docs/post-commit/test-audit-s4.jsonl

      - name: Run student-5 post-commit tests
        working-directory: student-5
        run: |
          mkdir -p docs/post-commit
          python -m pytest student-5/tests/post_commit/ -v > docs/post-commit/test-results.md
          status=$?
          echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> docs/post-commit/test-audit-s5.jsonl


      - name: Stop services
        if: always()
        working-directory: .
        run: docker compose down -v

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-5-azure-test-evidence
          path: /docs/post-commit/

  deploy_azure:
    runs-on: ubuntu-latest
    needs: [post_commit_tests]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up deployment environment
        working-directory: .
        run: bash scripts/clouddeployment/env-setup.sh

      - name: Build and push images
        working-directory: .
        run: bash scripts/clouddeployment/build-images.sh

      - name: Azure login (refresh)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Container Apps environment
        working-directory: .
        run: bash scripts/clouddeployment/deploy-azure-env.sh

      - name: Azure login (refresh again)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        working-directory: .
        run: bash scripts/clouddeployment/deploy-azure.sh

      - name: Validate deployment and generate evidence
        working-directory: .
        run: bash scripts/clouddeployment/deployment-testing.sh

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-evidence
          path: post-commit/deployment-results.md