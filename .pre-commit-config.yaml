# Once pre commit is ready run these commands:
# pre-commit install
# pre-commit run --all-files


# Run your manual tests before committing
# .venv/bin/python -m pytest student-1/tests/pre_commit/ -v


repos:
  - repo: local
    hooks:
    # Student 1 Hooks
      - id: student-1-ruff-scan
        name: Ruff Scan
        entry: python scripts/student-1/tests/pre_commit/test_ruff_scan.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "ruff==0.16.8"]
        pass_filenames: false
        stages: [pre-commit]

      - id: student-1-detect-secrets-scan
        name: detect-secrets Scan
        entry: python scripts/student-1/tests/pre_commit/test_secrets_scan.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "detect-secrets==1.5.0"]
        pass_filenames: false
        stages: [pre-commit]

      - id: student-1-pip-audit-scan
        name: pip-audit Scan
        entry: python scripts/student-1/tests/pre_commit/test_dependency_audit.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "pip-audit==2.10.1"]
        pass_filenames: false
        stages: [pre-commit]


