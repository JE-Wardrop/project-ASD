<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management System — Login</title>

    <!-- Shared CSS Theme -->
    <link rel="stylesheet" href="http://localhost:8080/styles.css">
</head>

<body>

<section id="loginPage" class="login-page">

    <div class="login-card">

        <h1>User Management</h1>

        <p>Sign in to continue</p>

        <div id="loginMessage"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    required>

            </div>

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    required>

            </div>

            <button
                type="submit"
                class="primary-button"
                style="width:100%;">

                Login

            </button>

        </form>

    </div>

</section>

<!-- This page only needs auth.js (login handling + the
     "already logged in" redirect) and utils.js, which
     auth.js doesn't strictly need but is kept for
     consistency with the other pages. -->

<script src="js/utils.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
