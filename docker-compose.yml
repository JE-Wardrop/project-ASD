services:

  frontend-service:
    build:
      context: ./student4/frontend-service
    container_name: student4-frontend-service
    ports:
      - "8080:80"
    depends_on:
      - enrolment-service
    networks:
      - enrolment-network
    restart: unless-stopped

  enrolment-service:
    build:
      context: ./student4
      dockerfile: enrolment-service/Dockerfile
    container_name: student4-enrolment-service
    ports:
      - "5001:5001"
    environment:
      DATABASE_SERVICE_URL: http://database-service:5002
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database-service
    networks:
      - enrolment-network
    restart: unless-stopped

  database-service:
    build:
      context: ./student4/database-service
    container_name: student4-database-service
    ports:
      - "5002:5002"
    volumes:
      - student4_database_data:/app/data
    networks:
      - enrolment-network
    restart: unless-stopped

volumes:
  student4_database_data:

networks:
  enrolment-network:
    driver: bridge