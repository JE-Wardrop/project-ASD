services:

  frontend:
    build:
      context: ./student-4/frontend
    container_name: student4-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - enrolment-network
    restart: unless-stopped

  backend:
    build:
      context: ./student-4
      dockerfile: backend/dockerfile
    container_name: student4-backend
    ports:
      - "5001:5001"
    environment:
      DATABASE_SERVICE_URL: http://database:5002
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
    networks:
      - enrolment-network
    restart: unless-stopped

  database:
    build:
      context: ./student-4/database
    container_name: student4-database
    ports:
      - "5002:5002"
    volumes:
      - student4_database_data:/app/data
    networks:
      - enrolment-network
    restart: unless-stopped

volumes:
  student4_database_data:

networks:
  enrolment-network:
    driver: bridge