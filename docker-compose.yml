#  Conventions:
#   - Every container listens on port 8000 INSIDE the network
#   - Host ports: frontend 810N, backend 820N, database 830N (N = student number)
#   - Containers call each other by SERVICE NAME, not localhost
services:

  # Shared landing page 
  shared-index:   # service name
    build: ./shared/frontend
    container_name: shared-index      # container name
    ports:
      - "8080:8000"
    restart: unless-stopped

  #  STUDENT 5 - Gia Tran - Transaction Management 

  student5-db:
    build: ./student-5/database
    container_name: student5-db
    ports:
      - "8305:8000"
    volumes:
      - student5-data:/data       
    restart: unless-stopped

  student5-backend:
    build: ./student-5/backend
    container_name: student5-backend
    ports:
      - "8205:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      DB_URL: http://student5-db:8000
      ACCOUNTS_URL: http://student2-backend:8000
      NOTIFICATIONS_URL: http://student3-backend:8000
      BACKEND_URL: http://localhost:8205
      REQUIRE_ACCOUNTS: "false"      # waiting for Binh service to run
    depends_on:
      - student5-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  student5-frontend:
    build: ./student-5/frontend
    container_name: student5-frontend
    ports:
      - "8105:8000"
    depends_on:
      - student5-backend
    restart: unless-stopped

  # OTHER MEMBERS ADD YOUR SERVICES BELOW 
  #                                  Frontend/Backend/Database 
  # student1-*  Juno  - Cards          8101 / 8201 / 8301
  # student2-*  Binh  - Accounts       8102 / 8202 / 8302
  # student3-*  Ivan  - Notifications  8103 / 8203 / 8303
  # student4-*  Sang  - Users          8104 / 8204 / 8304


volumes:
  student5-data:
