# Edit docker ports 8080:80 -> 8102:80
# backend context may not be needed to update; as agentic loop is not in showcase and is run on local machine


#  Conventions:
#   - Every container listens on port 8000 INSIDE the network
#   - Host ports: frontend 810N, backend 820N, database 830N (N = student number)
#   - Containers call each other by SERVICE NAME, not localhost
#

  # OTHER MEMBERS ADD YOUR SERVICES BELOW
  #                                  Frontend/Backend/Database
  # student1-*  Juno  - Cards          8101 / 8201 / 8301
  # student2-*  Binh  - Accounts       8102 / 8202 / 8302
  # student3-*  Ivan  - Notifications  8103 / 8203 / 8303
  # student4-*  Sang  - Users          8104 / 8204 / 8304


# Student 1

services:
  shared-index:   # service name
    build: ./shared/frontend
    container_name: shared-index      # container name
    ports:
      - "8080:8000"
    restart: unless-stopped


  # Student 1
  frontend-service:
    build:
      context: ./student-1/frontend
    container_name: frontend
    ports:
      - "8101:80"
    depends_on:
      - backend
    networks:
      - card-network
    restart: unless-stopped

  backend:
    build:
      context: ./student-1/backend
      dockerfile: dockerfile
    container_name: backend
    ports:
      - "8201:5001"
    environment:
      DATABASE_SERVICE_URL: http://database:5002
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
    networks:
      - card-network
    restart: unless-stopped

  database:
    build:
      context: ./student-1/database
    container_name: database
    ports:
      - "8301:5002"
    volumes:
      - database_data:/student-1/database/data
    networks:
      - card-network
    restart: unless-stopped

  # Student 2 (Binh - Accounts)
  student2-frontend:
    build:
      context: ./student-2/frontend
    container_name: student2-frontend
    ports:
      - "8102:80"
    depends_on:
      - student2-backend
    networks:
      - banking-network
    restart: unless-stopped

  student2-backend:
    build:
      context: ./student-2
      dockerfile: backend/dockerfile
    container_name: student2-backend
    ports:
      - "8202:5001"
    environment:
      DATABASE_SERVICE_URL: http://student2-database:5002
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_REVIEW_MODEL: llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student2-database
    networks:
      - banking-network
    restart: unless-stopped

  student2-database:
    build:
      context: ./student-2/database
    container_name: student2-database
    ports:
      - "8302:5002"
    environment:
      DB_PATH: /app/data/accounts.db
    volumes:
      - student2_db_data:/app/data
    networks:
      banking-network:
        aliases:
          - student2-database
    restart: unless-stopped

volumes:
  database_data:
  student2_db_data:

networks:
  card-network:
    driver: bridge
  banking-network:
    driver: bridge

