services:

#Student 1
  database:
    build: ./student-1/database
    container_name: database
    ports:
      - "5000:5000"
    volumes:
      - ./student-1/database:/app
    networks:
      - mynetwork

  frontend:
    build: ./student-1/frontend
    container_name: frontend
    ports:
      - "8000:8000"
    volumes:
      - ./student-1/frontend:/app
    networks:
      - mynetwork

    backend:
      build: ./student-1/backend
      container_name: backend
      ports:
        - "8080:8080"
      volumes:
        - ./student-1/backend:/app
      networks:
        - mynetwork

