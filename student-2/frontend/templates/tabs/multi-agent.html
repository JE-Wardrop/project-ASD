<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Multi-Agent Tab</title>
    <!-- Local deployment: <link rel="stylesheet" href="http://localhost:8080/styles.css"> -->
    <link rel="stylesheet" href="/css/shared.css"> <!-- Cloud deployment: shared theme bundled with this frontend -->
</head>
<body>
<main class="app-shell">
    <section class="card">
        <h2>Multi-Agent Mode</h2>
        <p>Run planner, worker, and reviewer agents in a coordinated workflow.</p>

        <div class="feature-toggle-row">
            <label class="toggle-switch" for="multi-agent-toggle">
                <input id="multi-agent-toggle" type="checkbox" checked>
                <span class="toggle-label">Multi-Agent Enabled</span>
            </label>

            <span id="multi-agent-state" class="feature-state feature-on">ON</span>
        </div>

        <form id="workflow-form" class="stack-form">
            <label for="workflow-request">User Request</label>
            <input
                id="workflow-request"
                name="user_request"
                list="workflow-request-samples"
                required
                placeholder="Example: Summarise account statuses for user_id(1)."
            >
            <datalist id="workflow-request-samples">
                <option value="Summarise account statuses for user_id(1)."></option>
                <option value="List frozen or closed accounts and recommend next steps."></option>
                <option value="Check the balance and status of account_id(3)."></option>
            </datalist>
            <div class="feature-actions" aria-label="Sample workflow requests">
                <button type="button" class="rag-action" data-sample-request="Summarise account statuses for user_id(1).">Use Sample 1</button>
                <button type="button" class="rag-action" data-sample-request="List frozen or closed accounts and recommend next steps.">Use Sample 2</button>
                <button type="button" class="rag-action" data-sample-request="Check the balance and status of account_id(3).">Use Sample 3</button>
            </div>
            <p class="rag-helper">Hint: use a full task request for planner-worker-reviewer flow.</p>
            <button type="submit" class="rag-action">Run Workflow</button>
        </form>

        <form id="status-form" class="stack-form">
            <button type="submit" class="rag-action">Get Workflow Status</button>
        </form>

        <div id="multi-agent-results" class="panel panel-mcp">Multi-agent responses will appear here.</div>
    </section>
</main>

<script>
// Same pattern as student-1's cm_multiagent.html (lab code used http://localhost:5001)
const apiBase = "";
const output = document.getElementById("multi-agent-results");
const modeToggle = document.getElementById("multi-agent-toggle");
const modeState = document.getElementById("multi-agent-state");
const workflowRequestInput = document.getElementById("workflow-request");
const STORAGE_KEY = "student2_multi_agent_mode_enabled";

function isEnabled() {
    return modeToggle.checked;
}

function renderState() {
    if (isEnabled()) {
        modeState.textContent = "ON";
        modeState.classList.add("feature-on");
        modeState.classList.remove("feature-off");
    } else {
        modeState.textContent = "OFF";
        modeState.classList.add("feature-off");
        modeState.classList.remove("feature-on");
    }
}

function renderDisabledMessage() {
    output.innerHTML = "<p>Multi-Agent Mode is OFF. Enable Multi-Agent Mode to run workflows.</p>";
}

function saveMode() {
    localStorage.setItem(STORAGE_KEY, String(isEnabled()));
}

function loadMode() {
    const persisted = localStorage.getItem(STORAGE_KEY);
    if (persisted === null) {
        modeToggle.checked = true;
    } else {
        modeToggle.checked = persisted === "true";
    }
    renderState();
}

// Same output format as student-1's cm_multiagent.html: endpoint title + pretty-printed JSON.
function renderJson(title, payload) {
    output.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(payload, null, 2)}</pre>`;
}

function renderError(title, error) {
    const message = error && error.message ? error.message : String(error);
    output.innerHTML = `<h3>${title}</h3><pre>${message}</pre>`;
}

async function postJson(path, data) {
    const res = await fetch(`${apiBase}${path}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-Multi-Agent-Mode": isEnabled() ? "on" : "off",
        },
        body: JSON.stringify(data),
    });
    const text = await res.text();
    try {
        return JSON.parse(text);
    } catch {
        return { raw: text };
    }
}

async function getJson(path) {
    const res = await fetch(`${apiBase}${path}`, {
        headers: {
            "X-Multi-Agent-Mode": isEnabled() ? "on" : "off",
        },
    });
    const text = await res.text();
    try {
        return JSON.parse(text);
    } catch {
        return { raw: text };
    }
}

modeToggle.addEventListener("change", () => {
    saveMode();
    renderState();

    if (!isEnabled()) {
        renderDisabledMessage();
    }
});

document.querySelectorAll("[data-sample-request]").forEach((button) => {
    button.addEventListener("click", () => {
        workflowRequestInput.value = button.dataset.sampleRequest || "";
        workflowRequestInput.focus();
    });
});

document.getElementById("workflow-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!isEnabled()) {
        renderDisabledMessage();
        return;
    }

    try {
        const user_request = workflowRequestInput.value.trim();
        const payload = await postJson("/multi-agent/workflow", { user_request });
        renderJson("Multi-Agent API: /multi-agent/workflow", payload);
    } catch (error) {
        renderError("Multi-Agent API Error: /multi-agent/workflow", error);
    }
});

document.getElementById("status-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!isEnabled()) {
        renderDisabledMessage();
        return;
    }

    try {
        const payload = await getJson("/multi-agent/workflow/status");
        renderJson("Multi-Agent API: /multi-agent/workflow/status", payload);
    } catch (error) {
        renderError("Multi-Agent API Error: /multi-agent/workflow/status", error);
    }
});

loadMode();
if (!isEnabled()) {
    renderDisabledMessage();
}
</script>

</body>
</html>
