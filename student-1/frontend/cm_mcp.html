<body>



<main class="app-shell">
    <section class="card">
        <h2>MCP Mode</h2>

        <div class="card-form">
            <label class="switches" for="mcp-mode-toggle">
                <input id="mcp-mode-toggle" type="checkbox" checked>
                <span class="toggle-label">MCP Enabled</span>
            </label>
            <span id="mcp-mode-state" class="feature-state feature-on">ON</span>
        </div>

        <!-- Information about MCP that will be needed here:

         I want MCP to run at localhost:5500,
         in dockerfile file it should alos run at 5500 as this is 
         an open port in this project.

        This will use card_count card_per_user_id
        This will use project files as well
        -->


        <h2>MCP Tools</h2>


        <div class="card-form">
            <button
                type="button"
                class="feature-form"
                hx-post="http://localhost:8000/mcp/card-count"
                hx-target="#mcp-result"
                hx-swap="innerHTML"
            >Get Card Count</button>
        </div>

        <hr>

        <form
            id="mcp-card-per-user-form"
            class="feature-form"
            hx-post="http://localhost:8000/mcp/card-per-user"
            hx-target="#mcp-result"
            hx-swap="innerHTML"
        >

            <label for="mcp_card_per_user_id">MCP: Cards by User ID</label>

            <input id="mcp_card_per_user_id" name="card_per_user_id" type="text" placeholder="Example: 1 card for User ID 1">

            <button type="submit" class="mcp-action">Run Tool</button>
        </form>

        <hr>
        
        <form
            id="mcp-project-form"
            class="feature-form"
            hx-post="http://localhost:8000/mcp/project-files"
            hx-target="#mcp-result"
            hx-swap="innerHTML"
        >
            <label for="mcp_directory_path">MCP: Project Files</label>
            <input id="mcp_directory_path" name="directory_path" type="text" value="..">
            <button type="submit" class="mcp-action">Run Tool</button>
        </form>

        <div id="mcp-result" class="panel panel-mcp">MCP tool responses will appear here.</div>
    </section>
</main>

<script>

// What I need to do:
// Connect these things to my backend code somehow
//  I literally am so lost as to what to actually do here

const mcpModeToggle = document.getElementById("mcp-mode-toggle");
const mcpModeState = document.getElementById("mcp-mode-state");
const mcpResultPanel = document.getElementById("mcp-result");

const MCP_STORAGE_KEY = "mcp_mode_enabled";

function isMcpEnabled() {
    return mcpModeToggle.checked;
}

function renderMcpState() {
    if (isMcpEnabled()) {
        mcpModeState.textContent = "ON";
        mcpModeState.classList.add("feature-on");
        mcpModeState.classList.remove("feature-off");
    } else {
        mcpModeState.textContent = "OFF";
        mcpModeState.classList.add("feature-off");
        mcpModeState.classList.remove("feature-on");
    }
}

// Gives the ability to turn MCP on and off
// should also visually display 
function renderMcpDisabledMessage() {
    mcpResultPanel.innerHTML = "<p>MCP Mode is OFF. Enable MCP Mode to run MCP tools.</p>";
}

function saveMcpMode() {
    localStorage.setItem(MCP_STORAGE_KEY, String(isMcpEnabled()));
}

function loadMcpMode() {
    const persisted = localStorage.getItem(MCP_STORAGE_KEY);
    if (persisted === null) {
        mcpModeToggle.checked = true;
    } else {
        mcpModeToggle.checked = persisted === "true";
    }
    renderMcpState();
}

mcpModeToggle.addEventListener("change", () => {
    saveMcpMode();
    renderMcpState();

    if (!isMcpEnabled()) {
        renderMcpDisabledMessage();
    }

});


// This eventListener is not properly connecting to the backend of the system.
// even without the shared style sheet the backend doesn't appear to be outputting anything into the mcp-result panel.

// HTMX is going up one level to cm_mcp.html?directory_path=.. 
// with a 200 GET request. 
// But I don't why is it isn't connecting to the backend, it cannot find the backend's full file path.


document.body.addEventListener("htmx:configRequest", (event) => {
    const trigger = event.detail.elt;
    if (trigger && trigger.classList.contains("mcp-action")) {
        event.detail.headers["X-MCP-Mode"] = isMcpEnabled() ? "on" : "off";
    }
});

document.body.addEventListener("htmx:beforeRequest", (event) => {
    const trigger = event.detail.elt;
    if (!trigger || !trigger.classList.contains("mcp-action")) {
        return;
    }

    if (!isMcpEnabled()) {
        event.preventDefault();
        renderMcpDisabledMessage();
    }
});

loadMcpMode();
if (!isMcpEnabled()) {
    renderMcpDisabledMessage();
}
