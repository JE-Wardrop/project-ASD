        //Lab code (week 4 /templates/ai_mode.html)

        const askForm = document.getElementById("ask-form");
        const askWithContextForm = document.getElementById("ask-with-context-form");

        async function renderIntoPanel(panelId, url, options = {}) {
            const panel = document.getElementById(panelId);

            try {
                const response = await fetch(url, options);
                const body = await response.text();
                panel.innerHTML = body;
            } catch (error) {
                panel.innerHTML = `<p>Request failed.</p><pre>${error}</pre>`;
            }
        }

        // to do with ask form, that is a lot of code that I do not really understand uhhhh
        askForm.addEventListener("submit", (event) => {
            event.preventDefault();
            //URLSearchParams is a built-in JavaScript 
            // interface that lets you easily read, add, update, and delete query parameters in a URL.
            // and putting this onto a new askFrom (formattedas form data?)
            const formData = new URLSearchParams(new FormData(askForm));

            //renders to the panel "ask". might have to 
            // class="panel" in html output allows this???

            renderIntoPanel("agent-result", "http://localhost:8201/ask", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData,
            });
        });

        // same with this girl
        askWithContextForm.addEventListener("submit", (event) => {
