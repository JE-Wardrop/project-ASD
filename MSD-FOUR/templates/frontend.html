<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>

    <h1>User Management</h1>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <section>
        <h2>Login</h2>

        <form
            hx-post="/users/login"
            hx-target="#login-result"
            hx-swap="innerHTML"
        >

            <label for="login-username">Username</label>
            <input
                type="text"
                id="login-username"
                name="username"
                required
            >

            <br><br>

            <label for="login-password">Password</label>
            <input
                type="password"
                id="login-password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>

        <div id="login-result"></div>
    </section>


    <hr>


    <!-- ========================= -->
    <!-- REGISTER -->
    <!-- ========================= -->

    <section>
        <h2>Register</h2>

        <form
            hx-post="/users/register"
            hx-target="#register-result"
            hx-swap="innerHTML"
        >

            <label for="register-username">Username</label>
            <input
                type="text"
                id="register-username"
                name="username"
                required
            >

            <br><br>

            <label for="register-email">Email</label>
            <input
                type="email"
                id="register-email"
                name="email"
                required
            >

            <br><br>

            <label for="register-password">Password</label>
            <input
                type="password"
                id="register-password"
                name="password"
                required
            >

            <br><br>

            <label for="register-first-name">First Name</label>
            <input
                type="text"
                id="register-first-name"
                name="first_name"
                required
            >

            <br><br>

            <label for="register-last-name">Last Name</label>
            <input
                type="text"
                id="register-last-name"
                name="last_name"
                required
            >

            <br><br>

            <label for="register-phone">Phone</label>
            <input
                type="text"
                id="register-phone"
                name="phone"
                required
            >

            <br><br>

            <button type="submit">Register</button>

        </form>

        <div id="register-result"></div>
    </section>


    <hr>


    <!-- ========================= -->
    <!-- VIEW USERS -->
    <!-- ========================= -->

    <section>
        <h2>Users</h2>

        <button
            hx-get="/users"
            hx-target="#users-list"
            hx-swap="innerHTML"
        >
            Load Users
        </button>

        <div id="users-list"></div>
    </section>


    <hr>


    <!-- ========================= -->
    <!-- GET ONE USER -->
    <!-- ========================= -->

    <section>
        <h2>Find User</h2>

        <form
            hx-get="/users/"
            hx-target="#user-result"
            hx-swap="innerHTML"
            hx-trigger="submit"
        >

            <label for="user-id">User ID</label>

            <input
                type="number"
                id="user-id"
                name="user_id"
                required
            >

            <button type="submit">Find User</button>

        </form>

        <div id="user-result"></div>
    </section>


    <hr>


    <!-- ========================= -->
    <!-- UPDATE USER -->
    <!-- ========================= -->

    <section>
        <h2>Update User</h2>

        <form
            hx-put="/users/1"
            hx-target="#update-result"
            hx-swap="innerHTML"
        >

            <label for="update-email">Email</label>
            <input
                type="email"
                id="update-email"
                name="email"
                required
            >

            <br><br>

            <label for="update-first-name">First Name</label>
            <input
                type="text"
                id="update-first-name"
                name="first_name"
                required
            >

            <br><br>

            <label for="update-last-name">Last Name</label>
            <input
                type="text"
                id="update-last-name"
                name="last_name"
                required
            >

            <br><br>

            <label for="update-phone">Phone</label>
            <input
                type="text"
                id="update-phone"
                name="phone"
                required
            >

            <br><br>

            <button type="submit">Update User</button>

        </form>

        <div id="update-result"></div>
    </section>


    <hr>


    <!-- ========================= -->
    <!-- DELETE USER -->
    <!-- ========================= -->

    <section>
        <h2>Delete User</h2>

        <button
            hx-delete="/users/1"
            hx-target="#delete-result"
            hx-swap="innerHTML"
        >
            Delete User 1
        </button>

        <div id="delete-result"></div>
    </section>

</body>
</html>
